# ========================================================
#            Настройки Алтаря Зачарований
# ========================================================
custom-table:
  item:
    name: "&5&lАлтарь Зачарований"
    lore:
      - "&7Древний чародейский стол, способный"
      - "&7наделять пустые книги могущественными чарами."
      - ""
      - "&eПоставьте и нажмите ПКМ для открытия."

  recipe:
    enabled: true
    shape:
      - "DND"
      - "OEO"
      - "OOO"
    ingredients:
      D: DIAMOND
      N: NETHER_STAR
      O: OBSIDIAN
      E: ENCHANTING_TABLE

  # Категории доступных чар для сотворения книг
  categories:
    combat:
      - vampirism
      - lightning
      - poison
      - stun
      - hunter
      - bleeding
      - antitotem
      - execution
    defense:
      - titan
      - dodge
      - thornsplus
    mining:
      - drill
      - autosmelt
      - telepathy
      - haste
      - nightminer
      - doubleore
      - experienced
      - farmer
      - lumberjack

economy:
  enabled: false
  apply-cost: 1000.0
  remove-cost: 500.0
  upgrade-chance-cost: 250.0

# Список параметров самих зачарований остается прежним

enchants:
  vampirism:
    enabled: true
    name: "&cВампиризм"
    max-level: 3
    chance: 30.0
