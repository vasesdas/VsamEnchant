# ========================================================
#            Настройки Алтаря Зачарований
# ========================================================
custom-table:
  item:
    name: "&5&lАлтарь Зачарований"
    lore:
      - "&7Древний чародейский стол, способный"
      - "&7накладывать могущественные кастомные чары."
      - ""
      - "&eПоставьте и нажмите ПКМ для открытия."

  recipe:
    enabled: true
    shape:
      - "DND"
      - "OEO"
      - "OOO"
    ingredients:
      D: DIAMOND
      N: NETHER_STAR
      O: OBSIDIAN
      E: ENCHANTING_TABLE

  # Единое Таинство Зачарования
  enchanting:
    exp-cost: 30        # Стоимость: 30 уровней
    lapis-cost: 3       # Стоимость: 3 лазурита
    success-chance: 80.0 # Шанс успеха: 80%

    pools:
      # Легендарные чары (~10% шанс)
      legendary:
        - execution
        - antitotem
        - drill

      # Редкие чары (~30% шанс)
      rare:
        - vampirism
        - lightning
        - stun
        - titan
        - dodge
        - doubleore
        - autosmelt
        - telepathy     # Только Телепатия
        - lumberjack

      # Обычные базовые чары (~60% шанс)
      common:
        - poison
        - bleeding
        - hunter
        - thornsplus
        - haste
        - nightminer
        - experienced
        - farmer

economy:
  enabled: false
  apply-cost: 1000.0
  remove-cost: 500.0
  upgrade-chance-cost: 250.0

