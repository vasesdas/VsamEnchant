# Настройки системы задержек (кулдаунов)
settings:
  # Интервал очистки памяти от старых кулдаунов (в секундах)
  cleanup-interval: 300

messages:
  # Сообщение, если предмет на кулдауне. %time% - оставшееся время, %enchant% - название зачарования.
  # Оставьте пустым (''), чтобы не спамить в чат.
  on-cooldown: '§cЗачарование %enchant% восстанавливается! Осталось: %time% сек.'