# Настройки экономики (требуется плагин Vault и любой экономический плагин, например EssentialsX)
economy:
  enabled: true

  # Стоимость применения книги к предмету
  apply-cost: 1000.0

  # Стоимость безопасного удаления зачарования свитком
  remove-cost: 500.0

  # Стоимость повышения шанса
  upgrade-chance-cost: 250.0